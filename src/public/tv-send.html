<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playdarr — Send to TV</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo"></div>
      <h1>Send to your TV</h1>
      <p id="intro">Paste the invite link someone shared with you, and the TV fills it in.</p>

      <div id="error-msg" class="error-msg" style="display:none"></div>

      <form id="send-form" class="guest-form tv-send-form" style="margin-top:0" autocomplete="off">
        <label class="tv-send-label" for="tv-code">Code on the TV</label>
        <input type="text" id="tv-code" class="search-input tv-send-code" placeholder="e.g. K7M2QX"
               maxlength="8" autocapitalize="characters" spellcheck="false">

        <label class="tv-send-label" for="tv-text">Invite link</label>
        <textarea id="tv-text" class="search-input tv-send-text" rows="3"
                  placeholder="https://…/join/…" maxlength="500" spellcheck="false"></textarea>
        <button type="button" id="paste-btn" class="btn-secondary tv-send-paste" style="display:none">Paste from clipboard</button>

        <label class="tv-send-label" for="tv-name">Your name <span class="tv-send-opt">(optional; the TV joins straight away if you fill it in)</span></label>
        <input type="text" id="tv-name" class="search-input" placeholder="Name the others will see" maxlength="40">

        <button type="submit" id="send-btn" class="btn-guest tv-send-btn">Send to TV →</button>
      </form>

      <div id="sent" class="tv-send-done" style="display:none">
        <h2>Sent ✓</h2>
        <p>Look at the TV. You can close this page.</p>
      </div>
    </div>
  </div>

  <script src="/js/tv-send.js"></script>
</body>
</html>
