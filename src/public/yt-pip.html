<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube</title>
  <!-- Holder for the YouTube player in the watch page's Picture in Picture window (player.js, openYtPip).
       The PiP window itself is a blank page with no address, so YouTube would get no referrer and refuse to play
       ("Error 153"); a real page from this server gives it one. The watch page builds the player in here. -->
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #p, #p > div, #p iframe { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <div id="p"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
